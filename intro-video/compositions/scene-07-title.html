  <script>
    window.__timelines = window.__timelines || {};

    // Build 36 pocket-watch dial ticks deterministically
    const ticksGroup = document.getElementById("s7-ticks");
    for (let i = 0; i < 36; i++) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", "200");
      line.setAttribute("y1", "6");
      line.setAttribute("x2", "200");
      line.setAttribute("y2", i % 3 === 0 ? "22" : "14");
      line.setAttribute("transform", `rotate(${i * 10} 200 200)`);
      ticksGroup.appendChild(line);
    }

    // Seeded deterministic spirit motes rising from the wet Quiapo cobblestones
    const canvas = document.getElementById("s7-motes");
    const ctx = canvas.getContext("2d");
    const motes = [];
    for (let i = 0; i < 28; i++) {
      const s1 = ((i * 73 + 19) % 97) / 97;
      const s2 = ((i * 41 + 7) % 89) / 89;
      const s3 = ((i * 59 + 31) % 83) / 83;
      motes.push({
        x0: 0.35 + s1 * 0.60,
        y0: s2,
        vy: 0.018 + s3 * 0.026,
        r: 2.0 + s1 * 2.5,
        ph: i * 1.13,
        cyan: i % 3 !== 0,
      });
    }

    function drawMotes(t) {
      ctx.clearRect(0, 0, 1920, 1080);
      for (const m of motes) {
        const y = ((m.y0 - m.vy * t) % 1 + 1) % 1;
        const x = m.x0 + Math.sin(m.ph + y * 9.0) * 0.008;
        const alpha = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2.1 + m.ph));
        const px = x * 1920;
        const py = y * 1080;
        ctx.beginPath();
        ctx.arc(px, py, m.r * 2.4, 0, Math.PI * 2);
        ctx.fillStyle = m.cyan
          ? `rgba(143, 227, 255, ${(alpha * 0.18).toFixed(3)})`
          : `rgba(232, 200, 114, ${(alpha * 0.16).toFixed(3)})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py, m.r, 0, Math.PI * 2);
        ctx.fillStyle = m.cyan
          ? `rgba(143, 227, 255, ${(alpha * 0.85).toFixed(3)})`
          : `rgba(255, 210, 122, ${(alpha * 0.85).toFixed(3)})`;
        ctx.fill();
      }
    }

    const moteDriver = {};
    let moteTime = 0;
    Object.defineProperty(moteDriver, "t", {
      get() {
        return moteTime;
      },
      set(v) {
        moteTime = v;
        drawMotes(v);
      },
    });
    drawMotes(0);

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s7-flash", { opacity: 0.92 }, { opacity: 0, duration: 0.45, ease: "expo.out" }, 0);
    tl.fromTo("#s7-img", { scale: 1.03 }, { scale: 1.08, duration: 10.5, ease: "sine.inOut" }, 0);
    tl.to(moteDriver, { t: 10.5, duration: 10.5, ease: "none" }, 0);

    tl.fromTo("#s7-seal-wrap", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.15);
    tl.fromTo("#s7-seal-outer", { rotation: 0 }, { rotation: 31.5, duration: 10.5, ease: "none" }, 0);

    tl.fromTo("#s7-loc", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 0.22);
    tl.fromTo("#s7-hero", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.45);
    tl.fromTo("#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.90);
    tl.fromTo("#s7-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.40, ease: "power4.out" }, 1.10);
    tl.fromTo("#s7-ep", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.40, ease: "power4.out" }, 1.40);
    tl.fromTo("#s7-cta", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 2.15);
    tl.fromTo("#s7-credits", { opacity: 0 }, { opacity: 1, duration: 0.50, ease: "power2.out" }, 2.50);

    window.__timelines["scene-07-title"] = tl;
  </script>
