name: Build the Godot game and deploy to GitHub Pages

# Exports the Godot 4 project in godot/ as a single-threaded web build (no SharedArrayBuffer, so it runs on
# plain GitHub Pages) and publishes it to the existing Pages link. Also builds a Linux (Steam Deck) binary.

on:
  push:
    branches: [main, ccr-d444c2c4-76rlh3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d tpz
          mv tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version

      - name: Stamp the build (shown on the title screen)
        run: |
          printf '{"commit": "%s"}' "${GITHUB_SHA::7}" > godot/data/build.json
          cat godot/data/build.json

      - name: Import the project
        run: |
          cd godot
          godot --headless --import || true
          godot --headless --import || true

      - name: Smoke test (story data, timing ring, dialogue, combat, courier run)
        run: |
          cd godot
          timeout 300 godot --headless --path . res://tests/Smoke.tscn 2>&1 | tee ../smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|FAIL " ../smoke.log; then echo "Smoke test failed"; exit 1; fi
          grep -q "failures: 0" ../smoke.log

      - name: Export Web (single-threaded)
        run: |
          mkdir -v -p build/web
          cd godot
          godot --headless --verbose --path . --export-release "Web" ../build/web/index.html
          ls -la ../build/web

      - name: Export Linux (Steam Deck / desktop)
        continue-on-error: true
        run: |
          mkdir -v -p build/linux
          cd godot
          godot --headless --verbose --path . --export-release "Linux" ../build/linux/balete.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: balete-linux-x86_64
          path: build/linux
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
